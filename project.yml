# Generate LeoneraChat.xcodeproj with `xcodegen generate` (https://github.com/yonaskolb/XcodeGen).
name: LeoneraChat
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # The CI passes all of these to xcodebuild; the values here are for local builds.
    APP_BUNDLE_ID: com.leonardoramirezr.leonerachat
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  LeoneraChat:
    type: application
    platform: iOS
    sources:
      - path: LeoneraChat
        excludes:
          - Info.plist
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: LeoneraChat
        # Extensions, if any are added, use $(APP_BUNDLE_ID).<suffix>.
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: LeoneraChat/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
